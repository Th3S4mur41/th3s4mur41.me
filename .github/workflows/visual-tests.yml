# This workflow runs the Playwright visual regression suite after Checks completes.
# It runs asynchronously (workflow_run) so the slower multi-browser screenshot comparisons
# never gate PR checks, mirroring the deploy pattern used by preview.yml.
name: Visual Tests
run-name: ${{ github.event.workflow_run.event }} [${{ github.event.workflow_run.id }}]

# Controls when the action will run.
on:
  workflow_run:
    workflows: [Checks]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}_${{ github.event.workflow_run.head_branch || github.run_id }}
  cancel-in-progress: true

jobs:
  playwright-version:
    name: '🔎 Read Playwright version'

    # Run only if checks succeeded
    if: github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-playwright-version.outputs.playwright-version }}

    steps:
      - name: '☁️ Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: '🔎 Get Playwright version'
        id: get-playwright-version
        uses: atos-actions/get-playwright-version@58a123c44cc7bef890aca78ce02dd7d75cb60804 # v2.0.14

  visual:
    name: '👁️ Visual Regression'
    needs: playwright-version
    runs-on: ubuntu-latest

    # Pin the Playwright browser image to the exact version installed in package-lock.json so
    # browsers are preinstalled (faster) and always match @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:${{ needs.playwright-version.outputs.version }}
    env:
      HOME: /root # The container's default user has no writable $HOME, which breaks npm/npx caches.

    steps:
      - name: '☁️ Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: '⚙️ Use Node.js'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          check-latest: true
          cache: 'npm'

      - name: '⛓️ Install dependencies'
        env:
          HUSKY: 0
        run: npm ci --no-audit --prefer-offline --progress=false

      - name: '📎 Download build output'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: '👁️ Run visual regression tests'
        run: npm run test:visual

      - name: '📊 Upload Playwright report'
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
