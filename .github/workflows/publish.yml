# This is the workflow to lint the source code
name: Publish

# Controls when the action will run.
on:
  # Allows you to call this workflow from other workflows
  workflow_call:
    secrets:
      CLOUDFLARE_ID:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true
      INDEXNOW_KEY:
        required: false
    inputs:
      CLOUDFLARE_PROJECT_NAME:
        description: 'The Cloudflare Pages project name'
        required: true
        type: string
    outputs:
      deployment-url:
        description: 'The URL of the deployed site'
        value: ${{ jobs.build.outputs.deployment-url }}

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:


    
jobs:
  build:
    name: '🚀 Publish'
    runs-on: ubuntu-latest

    outputs:
      deployment-url: ${{ steps.cloudflare-deploy.outputs.deployment-url }}

    permissions:
      contents: read
      actions: read
      deployments: write

    steps:
      # Do not checkout PR code in this privileged workflow (secrets are available
      # here). We deploy the trusted build artifact and pass commit metadata
      # explicitly so Cloudflare can still associate preview deployments with PRs.

      - name: '📎 Download build output'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create IndexNow key file
        run: |
          if [ -z "$INDEXNOW_KEY" ]; then
            echo 'INDEXNOW_KEY is empty; skipping key file creation.'
            exit 0
          fi

          # Validate the key before using it as part of a filename to prevent
          # path traversal or unexpected failures from slashes, dots, or whitespace.
          if [[ ! "$INDEXNOW_KEY" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo 'INDEXNOW_KEY contains characters that are unsafe for filenames; expected only letters, numbers, underscores, or hyphens.'
            exit 1
          fi

          printf '%s' "$INDEXNOW_KEY" > "dist/${INDEXNOW_KEY}.txt"
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

      - name: '🚀 Publish to Cloudflare Pages'
        id: cloudflare-deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        env:
          GITHUB_HEAD_REF: ${{ github.event.workflow_run.head_branch || github.head_ref }}
          GITHUB_REF_NAME: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ID }}
          command: pages deploy ./dist --project-name=${{ inputs.CLOUDFLARE_PROJECT_NAME }} --branch=${{ github.event.workflow_run.head_branch || github.head_ref }} --commit-hash=${{ github.event.workflow_run.head_sha || github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: '📝 Save deployment URL'
        run: |
          echo "Deployed to: ${{ steps.cloudflare-deploy.outputs.deployment-url }}"
          echo "Alias URL: ${{ steps.cloudflare-deploy.outputs.pages-deployment-alias-url }}"

  # Delete the source run's `build` artifact once it has been deployed to reduce
  # Actions storage. The upload keeps `retention-days: 1` (the native minimum) as
  # a fallback for failed or skipped publishes, which keep their artifact for
  # troubleshooting. Note: once deleted, re-running only this publish workflow
  # requires re-running the source Checks run to regenerate the artifact.
  #
  # This runs in a separate job so that only this minimal job (no checkout, no
  # secrets, no artifact contents) holds `actions: write`; the deploy job above,
  # which handles artifact contents, keeps `actions: read`.
  cleanup:
    name: '🧹 Delete build artifact'
    needs: [build]
    runs-on: ubuntu-latest

    # Only after a successful publish, and only when a source run exists
    # (manual workflow_dispatch runs have no workflow_run payload).
    if: needs.build.result == 'success' && github.event.workflow_run.id

    permissions:
      actions: write

    steps:
      - name: '🧹 Delete build artifact from source run'
        # Cleanup is best effort: never fail the publish (and skip downstream
        # jobs such as a11y-scan or indexnow) because of a cleanup issue.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          ARTIFACT_NAME: build
        run: |
          # Scope strictly to this repository and the run that produced the
          # deployed artifact, so artifacts from unrelated runs are never touched.
          artifact_ids="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?name=${ARTIFACT_NAME}&per_page=100" \
            --jq ".artifacts[] | select(.name == \"${ARTIFACT_NAME}\") | .id")"

          if [ -z "$artifact_ids" ]; then
            echo "No '${ARTIFACT_NAME}' artifact found for run ${SOURCE_RUN_ID}; nothing to delete."
            exit 0
          fi

          for artifact_id in $artifact_ids; do
            echo "Deleting artifact ${artifact_id} ('${ARTIFACT_NAME}') from run ${SOURCE_RUN_ID}."
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done

